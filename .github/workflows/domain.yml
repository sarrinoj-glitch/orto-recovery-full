# Сборка для домена клиники ortorecovery.ru (корень сайта, индексация включена).
# Результат — артефакт ortorecovery-ru: его содержимое загружается на хостинг REG.RU в папку сайта.
name: Build for ortorecovery.ru
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          GITHUB_PAGES: '1'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_INDEX: '1'
          NEXT_PUBLIC_SITE_URL: https://ortorecovery.ru
      - uses: actions/upload-artifact@v4
        with:
          name: ortorecovery-ru
          path: out
          include-hidden-files: true
          retention-days: 30
